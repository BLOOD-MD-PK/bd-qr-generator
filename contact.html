<!DOCTYPE html>
<html lang="en">

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contact - BD QR Generator</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>

<div class="logo">
BD QR Generator
</div>

<p>
Create QR Codes Easily
</p>

</header>

<p>
Have questions, suggestions or feedback?

</p>


<form>

type="text"

placeholder="Your Email">

</textarea>


<button type="button">
Send Message
</button>


</form>
